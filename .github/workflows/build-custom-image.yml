name: Build custom Docker image

on:
  push:
    branches:
      - main
      - fix/signature-image-size
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to publish'
        required: false
        default: 'signature-fix-2026-04-30'
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/documenso
  DEFAULT_IMAGE_TAG: signature-fix-2026-04-30

jobs:
  build-and-publish:
    name: Build and publish Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ inputs.image_tag || env.DEFAULT_IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            NEXT_PRIVATE_TELEMETRY_KEY=
            NEXT_PRIVATE_TELEMETRY_HOST=
